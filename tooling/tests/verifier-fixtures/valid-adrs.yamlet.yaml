system: adr-linked
topic: ADR links
summary: A spec whose requirement and criterion each link a decision record
description: >-
  Exercises the optional adrs list on a requirement (before its criteria) and on a criterion (at its end).
blast_radius: low
front: internal

requirements:
- id: RQ-1
  description: >-
    Parses the document with the chosen parser
  adrs:
  - ADR-0001-structural-pdf-parsing.adr.yaml
  acceptance-criteria:
  - id: AC-1
    pattern: ubiquitous
    shall:
    - parse the document
    adrs:
    - ADR-0001-structural-pdf-parsing.adr.yaml
    - ADR-0002-isolation-of-structural-parsing.adr.yaml
  - id: AC-2
    pattern: ubiquitous
    shall:
    - report a parse failure
