system: e-mail-sending-service
topic: Attachment-free (plain) e-mail sending
summary: A scope of the e-mail sending service that sends a plain e-mail — subject and content only, no attachment.
description: >-
  The same generic e-mail sending capability as the attachment-carrying scope, restricted to the attachment-free case: it sends a plain e-mail with a subject and body to a recipient. It is a separate, total scope rather than an optional attachment on the other one, because a contract input is never optional in yamlet — variance is modelled as a separate variant file.
blast_radius: high
front: internal
exposes:
  name: e-mail-sending-service-plain
  intent: send a plain e-mail with a subject and content to a recipient
  inputs:
  - recipient
  - subject
  - content

requirements:
- id: RQ-1
  description: >-
    A requested plain e-mail reaches its recipient with the given subject and content
  acceptance-criteria:
  - id: AC-1
    pattern: event
    when: a send is requested for {input.recipient}
    shall:
    - deliver an e-mail without attachment to {input.recipient}
    - use {input.subject} as the e-mail subject
    - use {input.content} as the e-mail body
- id: RQ-2
  description: >-
    A requested plain e-mail is never silently lost
  acceptance-criteria:
  - id: AC-2
    pattern: unwanted
    if: the e-mail to {input.recipient} cannot be delivered right away
    shall:
    - deliver the e-mail to {input.recipient} within 24 hours of the request
  - id: AC-3
    pattern: unwanted
    if: the e-mail to {input.recipient} is still undelivered 24 hours after the request
    shall:
    - mark the e-mail to {input.recipient} as undeliverable
