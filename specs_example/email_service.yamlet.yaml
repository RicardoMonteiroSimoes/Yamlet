system: e-mail-sending-service
topic: E-Mail sending service
summary: A generic e-mail sending service that exposes a contract for others to send e-mails with a given content
description: >-
  The generic e-mail sending service delivers any e-mail the platform needs to send, so no other component has to know how e-mail is sent. An e-mail it accepts is delivered or reported as undeliverable, never silently lost.
blast_radius: high
front: internal
exposes:
  name: e-mail-sending-service
  intent: send an e-mail with a subject, content and attachment to a recipient
  inputs:
  - recipient
  - subject
  - content
  - attachment

requirements:
- id: RQ-1
  description: >-
    A requested e-mail reaches its recipient with the given subject, content and attachment
  acceptance-criteria:
  - id: AC-1
    pattern: event
    when: a send is requested for {input.recipient}
    shall:
    - deliver an e-mail to {input.recipient}
    - use {input.subject} as the e-mail subject
    - use {input.content} as the e-mail body
    - attach {input.attachment} to the e-mail
- id: RQ-2
  description: >-
    A requested e-mail is never silently lost
  acceptance-criteria:
  - id: AC-2
    pattern: unwanted
    if: the e-mail to {input.recipient} cannot be delivered right away
    shall:
    - deliver the e-mail to {input.recipient} within 24 hours of the request
  - id: AC-3
    pattern: unwanted
    if: the e-mail to {input.recipient} is still undelivered 24 hours after the request
    shall:
    - mark the e-mail to {input.recipient} as undeliverable
